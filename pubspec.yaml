name: flutter_clock
description: A Simple Flutter project to display World Clocks dynamically from WorldTimeAPI.
publish_to: "none"
version: 3.1.0+11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  country_icons: ^3.0.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  material_ui: ^1.11.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - assets/
