name: flutter_clock
description: A modern Flutter World Clock application using the embedded IANA Time Zone Database with timeapi.io HTTPS fallback.
publish_to: "none"
version: 3.2.0+12

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  country_icons: ^3.0.0
  flutter_svg: ^2.5.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.11.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - assets/
