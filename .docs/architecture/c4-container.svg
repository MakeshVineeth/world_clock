<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title-container desc-container">
  <title id="title-container">C4 Container Diagram - Flutter Clock</title>
  <desc id="desc-container">Shows containers inside the Android app boundary and external endpoints.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .heading { font: 700 18px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .sub { font: 400 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .boundary { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 8 5; }
      .boundary-label { font: 700 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e3a8a; }
      .box-title { font: 700 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .box-type { font: 600 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #dbeafe; }
      .box-desc { font: 400 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .edge { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 600 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e293b; }
      .label-bg { fill: #eff6ff; }
      .label-bg-out { fill: #f8fafc; }
    </style>
  </defs>

  <rect class="bg" width="960" height="560" rx="12"/>
  <text x="28" y="36" class="heading">Flutter Clock — Containers (C4 Level 2)</text>
  <text x="28" y="56" class="sub">Runtime containers inside com.makeshtech.clock (Android 16 / Flutter 3.51) and external systems</text>

  <!-- App Boundary -->
  <rect class="boundary" x="28" y="76" width="630" height="454" rx="14"/>
  <text x="46" y="100" class="boundary-label">Flutter Clock Android Application [Android API 24–36]</text>

  <!-- Flutter UI & Presentation Container -->
  <g transform="translate(56, 124)">
    <rect width="260" height="114" rx="10" fill="#2563eb"/>
    <text x="130" y="26" text-anchor="middle" class="box-title">Flutter UI &amp; Controllers</text>
    <text x="130" y="43" text-anchor="middle" class="box-type">[Container: Dart 3 / material_ui / Provider]</text>
    <text x="130" y="66" text-anchor="middle" class="box-desc">LoaderScreen, HomeScreen, LocationsScreen,</text>
    <text x="130" y="82" text-anchor="middle" class="box-desc">ClockController, LocationsController,</text>
    <text x="130" y="98" text-anchor="middle" class="box-desc">Pure-Flutter Pulse &amp; Search Widgets</text>
  </g>

  <!-- Domain & Security Core Container -->
  <g transform="translate(366, 124)">
    <rect width="260" height="114" rx="10" fill="#1d4ed8"/>
    <text x="130" y="26" text-anchor="middle" class="box-title">Domain &amp; Security Core</text>
    <text x="130" y="43" text-anchor="middle" class="box-type">[Container: Pure Dart 3]</text>
    <text x="130" y="66" text-anchor="middle" class="box-desc">WorldTime, TimezoneLocation, Repositories,</text>
    <text x="130" y="82" text-anchor="middle" class="box-desc">TimezoneSearchService, InputValidator,</text>
    <text x="130" y="98" text-anchor="middle" class="box-desc">TimezoneFormatter (zero UI imports)</text>
  </g>

  <!-- Data & Platform Services Container -->
  <g transform="translate(56, 286)">
    <rect width="260" height="114" rx="10" fill="#2563eb"/>
    <text x="130" y="26" text-anchor="middle" class="box-title">Data &amp; Platform Adapters</text>
    <text x="130" y="43" text-anchor="middle" class="box-type">[Container: http / url_launcher / MethodChannel]</text>
    <text x="130" y="66" text-anchor="middle" class="box-desc">TimeApiClient, ClockRepositoryImpl,</text>
    <text x="130" y="82" text-anchor="middle" class="box-desc">LocationRepositoryImpl, UrlLauncherService,</text>
    <text x="130" y="98" text-anchor="middle" class="box-desc">PlatformAppLifecycleService</text>
  </g>

  <!-- Local Persistence & Assets -->
  <g transform="translate(366, 286)">
    <rect width="260" height="114" rx="10" fill="#0f766e"/>
    <text x="130" y="26" text-anchor="middle" class="box-title">Local Storage &amp; Assets</text>
    <text x="130" y="43" text-anchor="middle" class="box-type">[Container: SharedPreferences / AssetBundle]</text>
    <text x="130" y="66" text-anchor="middle" class="box-desc">Saved timezone keys (url, location, flag),</text>
    <text x="130" y="82" text-anchor="middle" class="box-desc">assets/countries.json, day/night GIFs,</text>
    <text x="130" y="98" text-anchor="middle" class="box-desc">country_icons PNG100px flag assets</text>
  </g>

  <!-- Android Native Host -->
  <g transform="translate(180, 434)">
    <rect width="320" height="76" rx="10" fill="#1e293b"/>
    <text x="160" y="24" text-anchor="middle" class="box-title">Android Native Host (MainActivity.kt)</text>
    <text x="160" y="40" text-anchor="middle" class="box-type">[Container: Kotlin / Android 16 API 36]</text>
    <text x="160" y="58" text-anchor="middle" class="box-desc">Edge-to-edge WindowCompat, shortEdges cutouts, NetworkSecurityConfig</text>
  </g>

  <!-- External Systems -->
  <g transform="translate(700, 146)">
    <rect width="228" height="92" rx="10" fill="#64748b"/>
    <text x="114" y="28" text-anchor="middle" class="box-title">timeapi.io</text>
    <text x="114" y="45" text-anchor="middle" class="box-type">[External HTTPS API]</text>
    <text x="114" y="66" text-anchor="middle" class="box-desc">/api/timezone/availabletimezones</text>
    <text x="114" y="82" text-anchor="middle" class="box-desc">/api/time/current/zone</text>
  </g>

  <g transform="translate(700, 290)">
    <rect width="228" height="86" rx="10" fill="#64748b"/>
    <text x="114" y="26" text-anchor="middle" class="box-title">External Browser / Play Store</text>
    <text x="114" y="43" text-anchor="middle" class="box-type">[External OS Intent]</text>
    <text x="114" y="64" text-anchor="middle" class="box-desc">HTTPS-only Play Store &amp; GitHub</text>
  </g>

  <g transform="translate(700, 420)">
    <rect width="228" height="86" rx="10" fill="#64748b"/>
    <text x="114" y="26" text-anchor="middle" class="box-title">Google Fonts CDN</text>
    <text x="114" y="43" text-anchor="middle" class="box-type">[External HTTPS Asset]</text>
    <text x="114" y="64" text-anchor="middle" class="box-desc">Aladin font delivery</text>
  </g>

  <!-- Edges -->
  <path class="edge" d="M 316 181 L 362 181"/>
  <path class="edge" d="M 186 238 L 186 282"/>
  <path class="edge" d="M 496 286 L 496 242"/>
  <path class="edge" d="M 316 343 L 362 343"/>
  <path class="edge" d="M 186 400 L 240 430"/>

  <!-- External Connections -->
  <path class="edge" d="M 316 310 L 696 196"/>
  <rect class="label-bg-out" x="514" y="232" width="132" height="16"/>
  <text x="580" y="244" text-anchor="middle" class="edge-label">TLS 1.2+ [JSON/HTTPS]</text>

  <path class="edge" d="M 316 356 L 696 333"/>
  <rect class="label-bg-out" x="518" y="330" width="128" height="16"/>
  <text x="582" y="342" text-anchor="middle" class="edge-label">ExternalApp [HTTPS]</text>

  <path class="edge" d="M 316 208 L 696 456"/>
  <rect class="label-bg-out" x="528" y="378" width="110" height="16"/>
  <text x="583" y="390" text-anchor="middle" class="edge-label">Font Fetch [HTTPS]</text>
</svg>
