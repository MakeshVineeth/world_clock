plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def storeFilePath = keystoreProperties.getProperty("storeFile")?.trim()
def keyAliasValue = keystoreProperties.getProperty("keyAlias")?.trim()
def keyPasswordValue = keystoreProperties.getProperty("keyPassword")?.trim()
def storePasswordValue = keystoreProperties.getProperty("storePassword")?.trim()
def resolvedStoreFile = storeFilePath ? file(storeFilePath) : null
def hasReleaseSigning = Boolean.valueOf(
    resolvedStoreFile != null &&
    resolvedStoreFile.exists() &&
    keyAliasValue &&
    keyPasswordValue &&
    storePasswordValue
)

android {
    namespace = "com.makeshtech.clock"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        disable += "InvalidPackage"
    }

    defaultConfig {
        applicationId = "com.makeshtech.clock"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            debugSymbolLevel = "FULL"
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                keyAlias = keyAliasValue
                keyPassword = keyPasswordValue
                storeFile = resolvedStoreFile
                storePassword = storePasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

pluginManager.withPlugin("org.jetbrains.kotlin.android") {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

flutter {
    source = "../.."
}
